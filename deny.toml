[graph]
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]

[advisories]
version = 2
yanked = "deny"
unmaintained = "all"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = []

[bans.build]
allow-build-scripts = [
    "thiserror",
    "proc-macro2",
    "quote",
    "libm",
    "ahash",
    "ash",
    "crossbeam-deque",
    "crossbeam-epoch",
    "crossbeam-utils",
    "getrandom",
    "libc",
    "naga",
    "num-traits",
    "objc-sys",
    "objc2",
    "parking_lot_core",
    "rayon-core",
    "rustix",
    "smithay-client-toolkit",
    "wayland-backend",
    "wayland-client",
    "wayland-sys",
    "wgpu",
    "wgpu-core",
    "wgpu-hal",
    "windows_x86_64_gnu",
    "windows_x86_64_msvc",
    "winit",
    "x11-dl",
    "zerocopy",
]

[licenses]
version = 2
private = { ignore = true }
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]
confidence-threshold = 0.93

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
