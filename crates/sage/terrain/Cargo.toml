[package]
name = "mint-sage-terrain"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[package.metadata.mint]
layer = 3

[[example]]
name = "terrain_view"
path = "examples/terrain_view/main.rs"
test = true

[dependencies]
mint-sage-map = { path = "../map" }
mint-render = { path = "../../core/render" }
mint-image = { path = "../../core/image" }
mint-vfs = { path = "../../core/vfs" }
mint-math = { path = "../../core/math" }
thiserror.workspace = true

[dev-dependencies]
mint-app = { path = "../../core/app" }
mint-ui = { path = "../../core/ui" }
mint-sage-big = { path = "../big" }
mint-sage-w3d = { path = "../w3d" }
mint-sage-model = { path = "../model" }
mint-sage-particle = { path = "../particle" }
mint-sage-ini = { path = "../ini" }
mint-sage-asset = { path = "../asset" }
mint-sage-scene = { path = "../scene" }

[lints]
workspace = true
