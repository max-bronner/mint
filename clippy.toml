too-many-arguments-threshold = 8
type-complexity-threshold = 500

allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true

disallowed-methods = [
    { path = "f32::sin", reason = "use mint_math::f32::sin" },
    { path = "f32::cos", reason = "use mint_math::f32::cos" },
    { path = "f32::tan", reason = "use mint_math::f32::tan" },
    { path = "f32::sin_cos", reason = "use mint_math::f32::sin_cos" },
    { path = "f32::asin", reason = "use mint_math::f32::asin" },
    { path = "f32::acos", reason = "use mint_math::f32::acos" },
    { path = "f32::atan", reason = "use mint_math::f32::atan" },
    { path = "f32::atan2", reason = "use mint_math::f32::atan2" },
    { path = "f32::exp", reason = "use mint_math::f32::exp" },
    { path = "f32::exp2", reason = "use mint_math::f32::exp2" },
    { path = "f32::exp_m1", reason = "use mint_math::f32::exp_m1" },
    { path = "f32::ln", reason = "use mint_math::f32::ln" },
    { path = "f32::ln_1p", reason = "use mint_math::f32::ln_1p" },
    { path = "f32::log", reason = "use mint_math::f32::log" },
    { path = "f32::log2", reason = "use mint_math::f32::log2" },
    { path = "f32::log10", reason = "use mint_math::f32::log10" },
    { path = "f32::powf", reason = "use mint_math::f32::powf" },
    { path = "f32::powi", reason = "use mint_math::f32::powi; the std one lowers to an LLVM intrinsic whose expansion is not a stable contract" },
    { path = "f32::cbrt", reason = "use mint_math::f32::cbrt" },
    { path = "f32::hypot", reason = "use mint_math::f32::hypot" },
    { path = "f32::sinh", reason = "use mint_math::f32::sinh" },
    { path = "f32::cosh", reason = "use mint_math::f32::cosh" },
    { path = "f32::tanh", reason = "use mint_math::f32::tanh" },
    { path = "f32::asinh", reason = "use mint_math::f32::asinh" },
    { path = "f32::acosh", reason = "use mint_math::f32::acosh" },
    { path = "f32::atanh", reason = "use mint_math::f32::atanh" },
    { path = "f32::mul_add", reason = "banned outright, no replacement: a fused multiply-add is a different operation from `a * b + c`. Write the multiply and the add." },

    { path = "f64::sin", reason = "use mint_math::f64::sin" },
    { path = "f64::cos", reason = "use mint_math::f64::cos" },
    { path = "f64::tan", reason = "use mint_math::f64::tan" },
    { path = "f64::sin_cos", reason = "use mint_math::f64::sin_cos" },
    { path = "f64::asin", reason = "use mint_math::f64::asin" },
    { path = "f64::acos", reason = "use mint_math::f64::acos" },
    { path = "f64::atan", reason = "use mint_math::f64::atan" },
    { path = "f64::atan2", reason = "use mint_math::f64::atan2" },
    { path = "f64::exp", reason = "use mint_math::f64::exp" },
    { path = "f64::exp2", reason = "use mint_math::f64::exp2" },
    { path = "f64::exp_m1", reason = "use mint_math::f64::exp_m1" },
    { path = "f64::ln", reason = "use mint_math::f64::ln" },
    { path = "f64::ln_1p", reason = "use mint_math::f64::ln_1p" },
    { path = "f64::log", reason = "use mint_math::f64::log" },
    { path = "f64::log2", reason = "use mint_math::f64::log2" },
    { path = "f64::log10", reason = "use mint_math::f64::log10" },
    { path = "f64::powf", reason = "use mint_math::f64::powf" },
    { path = "f64::powi", reason = "use mint_math::f64::powi; the std one lowers to an LLVM intrinsic whose expansion is not a stable contract" },
    { path = "f64::cbrt", reason = "use mint_math::f64::cbrt" },
    { path = "f64::hypot", reason = "use mint_math::f64::hypot" },
    { path = "f64::sinh", reason = "use mint_math::f64::sinh" },
    { path = "f64::cosh", reason = "use mint_math::f64::cosh" },
    { path = "f64::tanh", reason = "use mint_math::f64::tanh" },
    { path = "f64::asinh", reason = "use mint_math::f64::asinh" },
    { path = "f64::acosh", reason = "use mint_math::f64::acosh" },
    { path = "f64::atanh", reason = "use mint_math::f64::atanh" },
    { path = "f64::mul_add", reason = "banned outright, no replacement: a fused multiply-add is a different operation from `a * b + c`. Write the multiply and the add." },
